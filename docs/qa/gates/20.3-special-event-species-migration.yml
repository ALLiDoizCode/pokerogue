# Design Decisions Review

design_decisions:
  process_reuse:
    decision: "Extend existing seasonal-event-engine.lua instead of creating new process"
    rationale: "Event species data already embedded, avoids cross-process communication overhead"
    assessment: EXCELLENT
    benefits:
      - "Maintains atomicity of event data and species queries"
      - "Leverages existing event activation logic"
      - "Reduces process count and coordination complexity"
      - "Process size remains well under limit (43.42 KB vs 500 KB)"

  metadata_only_generation:
    decision: "GenerateEventSpecies returns metadata and seeds, not full stats"
    rationale: "Stat generation requires species database integration"
    assessment: GOOD
    benefits:
      - "Lightweight handler execution"
      - "Delegates complex calculations to specialized processes"
      - "Provides seed offsets for deterministic client-side generation"
    considerations:
      - "Client must handle stat/shiny/ability generation using provided seeds"
      - "Requires coordination with species database process"

  collection_tracking_in_gamestate:
    decision: "Use msg.GameState JSON parameter for persistence"
    rationale: "Stateless design, client manages save data"
    assessment: EXCELLENT
    benefits:
      - "No process-local state required"
      - "Client controls persistence strategy"
      - "Easy serialization/deserialization with JSON"
      - "Consistent with other stateless process patterns"

  deterministic_rng_lcg:
    decision: "Implement LCG (Linear Congruential Generator) for seeded randomness"
    rationale: "Match TypeScript randSeedInt behavior deterministically"
    assessment: EXCELLENT
    benefits:
      - "Reproducible results for same seed"
      - "Simple and efficient implementation"
      - "Matches TypeScript RNG behavior"
      - "Enables parity validation across implementations"

