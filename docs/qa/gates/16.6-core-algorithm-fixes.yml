  - algorithm: 'Type Effectiveness Chart'
    status: VERIFIED
    source: 'src/data/type.ts:5-270'
    implementation: 'Full 18×18 type chart (+1.5KB)'
    notes: 'Returns exact TypeDamageMultiplier values: 0, 0.25, 0.5, 1, 2, 4, 8'
  - algorithm: 'AI Switch Decision'
    status: VERIFIED
    source: 'src/phases/enemy-command-phase.ts:69-71'
    formula: 'switchPenalty = 1 - (0.1 ^ (1/switchCounter)), threshold = base * (1 - penalty)'
    notes: 'Simplified interface with exponential decay. Thresholds: Boss=2.0, Regular=3.0'
  - algorithm: 'Money Rewards'
    status: VERIFIED
    formula: '10 * wave * strengthBonus * multiplier'
    notes: 'Linear scaling (not quadratic). Corrected from incorrect implementation.'
  - algorithm: 'Modifier Chance'
